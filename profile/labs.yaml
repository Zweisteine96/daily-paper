# 追踪的实验室 / 学者。管道会按作者名在 arXiv 上查最近 days_back 天的论文，
# 生成 data/labs.json 供「学者追踪」页展示；每日推荐里命中这些作者的论文也会加上徽标并略微加分。
#
# 姓名要和 arXiv 上的署名一致（英文，First Last）。同名误报会用作者列表精确匹配过滤。
# 随意增删，下一次运行生效。

days_back: 45          # 追踪窗口
max_per_author: 30     # 每位学者最多保留多少篇
boost: 0.06            # 每日推荐里命中追踪学者时的加分
# 只保留这些 arXiv 分类的论文，用来过滤同名学者（比如天体物理领域的同名作者）
categories: [cs.RO, cs.AI, cs.LG, cs.CV, cs.CL, cs.HC, cs.MA, eess.SY]

