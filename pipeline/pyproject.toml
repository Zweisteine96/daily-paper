[project]
name = "techstation"
version = "0.1.0"
description = "每日抓取 arXiv 论文与 GitHub 项目并按个人兴趣打分的管道"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "numpy>=1.26",
    "fastembed>=0.4",
]

[project.scripts]
techstation = "techstation.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["techstation"]
